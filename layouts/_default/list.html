{{ define "main" }}
  <div class="list-head">
    <h1 class="list-title-header">{{ .Title }}</h1>
  </div>
  {{ .Content }}
  {{ range .Pages }}
    {{ $dateHuman := .Date | time.Format ":date_long" }}
    <div class="article-summary-container">
      <h2 class="article-summary-title">{{ .LinkTitle }}</h2>
      <h3 class="article-summary-date">{{ $dateHuman }}</h3>
      {{ .Description }}
      <a class="read-more-link" href="{{ .RelPermalink }}">Read more...</a>
      <hr />
    </div>
  {{ end }}
{{ end }}
